name: Teamcenter compatibility regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline protocol regression
        run: python -m unittest tests.unit.test_teamcenter_compatibility -v
      - name: Check Python syntax
        run: python -m compileall -q src tests scripts/check_teamcenter_context.py
